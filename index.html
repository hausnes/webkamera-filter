<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Webcam Santa Filter</title>
  <link rel="stylesheet" href="styles.css" />
  <!-- three.js and MediaPipe Tasks Vision are served from node_modules via Express -->
  <script type="importmap">
    {
      "imports": {
        "three": "/three/three.module.js",
        "three/addons/": "/three/addons/",
        "@mediapipe/tasks-vision": "/mediapipe/vision_bundle.mjs"
      }
    }
  </script>
</head>
<body>
  <header>
    <h1>SantaCam</h1>
    <p>Turn on your webcam and become Santa Claus 🎅</p>
  </header>

  <main>
    <div class="stage" id="stage">
      <!-- The video is only a frame source; everything is composited in WebGL on the canvas -->
      <video id="video" playsinline autoplay muted></video>
      <canvas id="overlay"></canvas>
    </div>

    <div class="controls">
      <button id="startBtn">Start Camera</button>
      <button id="stopBtn" disabled>Stop Camera</button>
      <button id="snapBtn" disabled>Take Snapshot</button>
      <label class="toggle"><input type="checkbox" id="snowToggle" checked /> Snow</label>
    </div>

    <div id="messages" class="messages" role="status" aria-live="polite"></div>

    <div class="snapshot">
      <img id="snapshotImg" alt="Snapshot" />
    </div>
  </main>

  <footer>
    <small>All processing happens locally in your browser.</small>
  </footer>

  <script type="module" src="script.js"></script>
</body>
</html>
